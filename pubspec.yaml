name: dnd_app
description: "Помощник игрока D&D: персонажи, расы и классы."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.2.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  bloc: ^8.1.4
  dio: ^5.5.0
  flutter_animate: ^4.5.0
  flutter_bloc: ^8.1.5
  freezed_annotation: ^2.4.1
  get_it: ^7.7.0
  go_router: ^14.2.1
  json_annotation: ^4.9.0
  injectable: ^2.4.4
  logger: ^2.4.0
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.7
  freezed: ^2.5.2
  injectable_generator: ^2.6.2
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.7.1
  mocktail: ^1.0.4

flutter:
  assets:
    - assets/
    - assets/images/
    - assets/figures/
  uses-material-design: true
  fonts:
    - family: AlegreyaSC
      fonts:
        - asset: assets/fonts/AlegreyaSC-Medium.ttf
          weight: 500
        - asset: assets/fonts/AlegreyaSC-Bold.ttf
          weight: 700
    - family: AlegreyaSans
      fonts:
        - asset: assets/fonts/AlegreyaSans-Regular.ttf
        - asset: assets/fonts/AlegreyaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/AlegreyaSans-Bold.ttf
          weight: 700
