targets:
  $default:
    builders:
      injectable_generator:injectable_builder:
        options:
          auto_register: true
          # Автоматически регистрируются репозитории и сервисы.
          # Блоки с параметрами создаются вручную там, где нужны.
          class_name_pattern: "Service$|Repository$"
          file_name_pattern: "_service$|_repository$"
      json_serializable:
        options:
          explicit_to_json: true
